name: Production Security Watchdog (frankfru.com)

on:
  schedule:
    - cron: '0 8 * * *'  # Runs daily at 08:00 UTC
  workflow_dispatch:      # Allow manual trigger from GitHub UI

jobs:
  audit-production:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Header & Exposure Audit against Production
        run: python3 scanner.py https://frankfru.com || true

      - name: Run SSL/TLS Expiry Check against Production
        run: python3 ssl_checker.py frankfru.com 443 || true
